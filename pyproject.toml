[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-sourcing-scorecard"
version = "0.1.0"
description = "Scores candidates from GitHub + LinkedIn CSV signals against an open req."
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
source-candidates = "sourcing.cli:main"
source-candidates-experimental = "sourcing.cli_experimental:main"
compare-passes = "sourcing.compare_passes:main"

[tool.setuptools.packages.find]
where = ["src"]
